<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ficha de trabajo · Compras online</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #eef3f8; color: #17283b;
    font: 1rem/1.55 system-ui, sans-serif; }
  main { width: min(900px, 94%); margin: 2rem auto; }
  header, section { padding: clamp(1rem, 4vw, 2rem); border-radius: 14px; }
  header { background: #132c46; color: white; }
  header p, h1 { margin: .25rem 0; }
  header p:first-child { color: #a6e4df; }
  nav { display: flex; flex-wrap: wrap; gap: .5rem; margin: 1rem 0; }
  button { font: inherit; font-weight: 650; cursor: pointer;
    padding: .65rem .9rem; border: 1px solid #647b91; border-radius: 8px;
    background: white; color: #132c46; }
  button[aria-selected="true"], button[type="submit"] {
    background: #075b57; border-color: #075b57; color: white;
  }
  :focus-visible { outline: 3px solid #a44600; outline-offset: 3px; }
  section { background: white; border: 1px solid #c8d5e2; }
  h2 { margin: 0 0 .5rem; }
  .pregunta { margin: 1.35rem 0; }
  label { display: block; margin-bottom: .4rem; }
  label strong { display: block; color: #075b57; margin-bottom: .2rem; }
  textarea, input { display: block; width: 100%; padding: .65rem;
    border: 1px solid #647b91; border-radius: 7px; font: inherit;
    color: inherit; background: #fbfdff; }
  textarea { min-height: 7rem; resize: vertical; }
  input { max-width: 32rem; margin-bottom: 1rem; }
</style>
</head>
<body>
<main>
  <header>
    <p>Educación financiera y consumo responsable · 4.º de ESO</p>
    <h1>Compras online y protección del consumidor</h1>
    <p>Lee el manual y los dos casos. Responde con tus palabras y descarga el PDF antes de cerrar la ficha.</p>
  </header>
  <nav id="pestanas" role="tablist" aria-label="Apartados de la ficha"></nav>
  <div id="paneles"></div>
  <noscript>Activa JavaScript en el navegador para rellenar la ficha y descargar el PDF.</noscript>
</main>

<script>
"use strict";

const apartados = [
  {
    titulo: "Antes de empezar",
    intro: "Responde individualmente después de leer el manual. Explica las ideas con tus propias palabras.",
    preguntas: [
      ["Derechos del consumidor (p. 3)",
       "Antes de confirmar una compra online, ¿qué información debe facilitarte la tienda sobre la identidad del vendedor, los gastos de envío y las condiciones de entrega?"],
      ["Cómo comprobar una tienda online (pp. 4–5 y 9)",
       "Una tienda que no conoces tiene HTTPS y muchas reseñas positivas. Además de mirar esos dos detalles, ¿qué tres comprobaciones recomienda el manual antes de comprar? Explica para qué te serviría cada una."],
      ["Seguridad en los pagos (p. 7)",
       "¿En qué consiste la autenticación de dos factores (2FA)? Pon un ejemplo de segunda verificación y explica por qué añade protección si alguien consigue tu contraseña."]
    ]
  },
  {
    titulo: "Operación Fantasma",
    intro: "Leed el caso de María y completad en equipo el informe de «rescate del consumidor». Justificad las respuestas con detalles del caso y del manual.",
    preguntas: [
      ["Identificad los problemas y los derechos",
       "¿Qué diferencias señala María entre los auriculares anunciados y los que recibió? ¿Qué problema encuentra al intentar informarse sobre la devolución? Relacionad cada problema con un derecho del consumidor explicado en el manual."],
      ["Proponed una solución",
       "¿Cómo contactaríais con el vendedor? Indicad qué le explicaríais, qué solución pediríais y qué pruebas adjuntaríais."],
      ["Preparad los siguientes pasos",
       "Si el vendedor no responde o no ofrece una solución, ¿a qué servicio de resolución de conflictos u organismo de protección del consumidor podría acudir María? Explicad qué documentación le convendría conservar para reclamar."],
      ["Evaluad la seguridad de la tienda",
       "¿Qué comprobaríais sobre el certificado SSL o HTTPS, las políticas de privacidad y devolución y los datos de contacto? Separad lo que dice el caso de lo que no se puede verificar. Con la información disponible, ¿recomendaríais comprar en esa tienda? Justificad la respuesta."]
    ]
  },
  {
    titulo: "Operación Hydra",
    intro: "Leed el caso de Pedro y preparad en equipo un plan de acción contra el fraude. No introduzcáis datos bancarios reales en la ficha.",
    preguntas: [
      ["Analizad el caso",
       "Reconstruid lo ocurrido desde la compra de la mochila hasta la aparición de los cargos y la llegada del correo. ¿Qué indicios hacen sospechar de phishing? Distinguid los hechos confirmados de las hipótesis sobre cómo pudieron obtenerse los datos de la tarjeta."],
      ["Proponed medidas de protección",
       "Redactad una lista de buenas prácticas para compartir con la clase. Incluid cómo verificar la autenticidad de una tienda, para qué sirve la autenticación de dos factores (2FA) y qué hacer si un correo pide datos confidenciales mediante un enlace."],
      ["Resolved la situación de fraude",
       "Redactad un plan ordenado para Pedro. ¿Qué debería hacer primero al detectar los cargos no autorizados? Indicad cómo contactar con el banco, qué pruebas guardar, a quién recurrir si necesita reclamar o denunciar y cómo proteger su cuenta frente a futuros intentos."]
    ]
  }
];

const $ = id => document.getElementById(id);

function crear(etiqueta, texto) {
  const nodo = document.createElement(etiqueta);
  if (texto !== undefined) nodo.textContent = texto;
  return nodo;
}

const titulos = [...apartados.map(a => a.titulo), "descarga tu trabajo"];
const pestanas = [];
const paneles = [];
const campos = [];

titulos.forEach((titulo, i) => {
  const boton = crear("button", titulo);
  boton.type = "button";
  boton.id = `tab-${i}`;
  boton.setAttribute("role", "tab");
  boton.setAttribute("aria-controls", `panel-${i}`);
  boton.addEventListener("click", () => activar(i));
  boton.addEventListener("keydown", e => {
    let destino;
    if (e.key === "ArrowRight") destino = (i + 1) % titulos.length;
    else if (e.key === "ArrowLeft") destino = (i - 1 + titulos.length) % titulos.length;
    else if (e.key === "Home") destino = 0;
    else if (e.key === "End") destino = titulos.length - 1;
    else return;
    e.preventDefault();
    activar(destino);
    pestanas[destino].focus();
  });
  $("pestanas").append(boton);
  pestanas.push(boton);

  const panel = crear("section");
  panel.id = `panel-${i}`;
  panel.hidden = true;
  panel.setAttribute("role", "tabpanel");
  panel.setAttribute("aria-labelledby", boton.id);
  $("paneles").append(panel);
  paneles.push(panel);

  const apartado = apartados[i];
  if (!apartado) {
    const form = crear("form");
    form.id = "entrega";
    const etiqueta = crear("label", "Nombre y apellidos");
    etiqueta.htmlFor = "nombre";
    const nombre = crear("input");
    nombre.id = "nombre";
    nombre.required = true;
    nombre.maxLength = 100;
    nombre.autocomplete = "name";
    const descargar = crear("button", "Descargar respuestas en PDF");
    descargar.type = "submit";
    form.append(etiqueta, nombre, descargar);
    panel.append(form);
    return;
  }

  panel.append(crear("h2", titulo), crear("p", apartado.intro));
  campos[i] = apartado.preguntas.map(([tema, pregunta], j) => {
    const bloque = crear("div");
    bloque.className = "pregunta";
    const tituloPregunta = `${j + 1}. ${tema}`;
    const etiqueta = crear("label");
    const respuesta = crear("textarea");
    respuesta.id = `respuesta-${i}-${j}`;
    etiqueta.htmlFor = respuesta.id;
    etiqueta.append(crear("strong", tituloPregunta), document.createTextNode(pregunta));
    bloque.append(etiqueta, respuesta);
    panel.append(bloque);
    return { tituloPregunta, pregunta, respuesta };
  });
});

function activar(indice) {
  pestanas.forEach((boton, i) => {
    const activa = i === indice;
    boton.tabIndex = activa ? 0 : -1;
    boton.setAttribute("aria-selected", String(activa));
    paneles[i].hidden = !activa;
  });
}
activar(0);

// Generador de PDF A4 sin librerías ni conexión.
const win1252 = "€\0‚ƒ„…†‡ˆ‰Š‹Œ\0Ž\0\0‘’“”•–—˜™š›œ\0žŸ";

function textoPDF(texto) {
  return Array.from(texto.normalize("NFC"), c => {
    const n = c.codePointAt(0);
    if (n >= 32 && n <= 126) return "\\()".includes(c) ? "\\" + c : c;
    const i = win1252.indexOf(c);
    const byte = n >= 160 && n <= 255 ? n : i >= 0 && n !== 0 ? i + 128 : 63;
    return "\\" + byte.toString(8).padStart(3, "0");
  }).join("");
}

function generarPDF(nombre) {
  const paginas = [[]];
  const canvas = document.createElement("canvas").getContext("2d");
  let y = 790;

  function nuevaPagina() { paginas.push([]); y = 790; }

  function ajustar(texto, tam, negrita) {
    canvas.font = `${negrita ? "bold " : ""}${tam}px Arial, sans-serif`;
    const cabe = linea => canvas.measureText(linea).width <= 480;
    return texto.split(/\r\n?|\n/).flatMap(parrafo => {
      const lineas = [];
      let linea = "";
      for (const palabra of parrafo.trim().split(/\s+/)) {
        const candidata = linea ? `${linea} ${palabra}` : palabra;
        if (cabe(candidata)) {
          linea = candidata;
        } else {
          if (linea) lineas.push(linea);
          linea = "";
          for (const letra of palabra) {
            if (linea && !cabe(linea + letra)) {
              lineas.push(linea);
              linea = "";
            }
            linea += letra;
          }
        }
      }
      return [...lineas, linea];
    });
  }

  function escribir(texto, tam = 11, negrita = false, espacio = 6) {
    for (const linea of ajustar(texto, tam, negrita)) {
      if (y < 55) nuevaPagina();
      paginas[paginas.length - 1].push(
        `BT /${negrita ? "B" : "R"} ${tam} Tf 1 0 0 1 54 ${y} Tm (${textoPDF(linea)}) Tj ET\n`
      );
      y -= tam + 4;
    }
    y -= espacio;
  }

  escribir("Compras online y protección del consumidor", 18, true);
  escribir(`Nombre y apellidos: ${nombre}`, 12, false, 16);

  apartados.forEach((apartado, i) => {
    if (y < 180) nuevaPagina();
    escribir(apartado.titulo, 15, true, 8);
    campos[i].forEach(({ tituloPregunta, pregunta, respuesta }) => {
      const alto = ajustar(tituloPregunta, 11, true).length * 15 +
                   ajustar(pregunta, 10, false).length * 14;
      if (y < 80 + alto) nuevaPagina();
      escribir(tituloPregunta, 11, true, 2);
      escribir(pregunta, 10, false, 4);
      escribir(respuesta.value.trim() || "Sin responder", 11, false, 12);
    });
  });

  const objetos = [
    "<< /Type /Catalog /Pages 2 0 R >>",
    `<< /Type /Pages /Count ${paginas.length} /Kids [${paginas.map((_, i) => `${5 + 2*i} 0 R`).join(" ")}] >>`,
    "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>",
    "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>"
  ];

  paginas.forEach((lineas, i) => {
    const pie = textoPDF(`Página ${i + 1} de ${paginas.length}`);
    const contenido = lineas.join("") + `BT /R 9 Tf 1 0 0 1 54 30 Tm (${pie}) Tj ET\n`;
    objetos.push(
      `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /R 3 0 R /B 4 0 R >> >> /Contents ${6 + 2*i} 0 R >>`,
      `<< /Length ${contenido.length} >>\nstream\n${contenido}endstream`
    );
  });

  let pdf = "%PDF-1.4\n";
  const posiciones = [];
  objetos.forEach((objeto, i) => {
    posiciones.push(pdf.length);
    pdf += `${i + 1} 0 obj\n${objeto}\nendobj\n`;
  });
  const xref = pdf.length;
  pdf += `xref\n0 ${objetos.length + 1}\n0000000000 65535 f \n`;
  posiciones.forEach(p => { pdf += `${String(p).padStart(10, "0")} 00000 n \n`; });
  pdf += `trailer\n<< /Size ${objetos.length + 1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`;
  return new Blob([pdf], { type: "application/pdf" });
}

$("nombre").addEventListener("input", () => $("nombre").setCustomValidity(""));
$("entrega").addEventListener("submit", e => {
  e.preventDefault();
  const nombre = $("nombre").value.trim();
  if (!nombre) {
    $("nombre").setCustomValidity("Escribe tu nombre y apellidos.");
    $("nombre").reportValidity();
    return;
  }
  const enlace = crear("a");
  const url = URL.createObjectURL(generarPDF(nombre));
  const sufijo = nombre.replace(/[^\p{L}\p{N}]+/gu, "-").replace(/^-|-$/g, "");
  enlace.href = url;
  enlace.download = `Ficha-compras-online-${sufijo || "entrega"}.pdf`;
  document.body.append(enlace);
  enlace.click();
  enlace.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
});
</script>
</body>
</html>
